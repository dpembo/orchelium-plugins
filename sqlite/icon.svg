<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Thin cylinder (conveys "lite" / lightweight) -->
  <rect x="8" y="20" width="28" height="10" fill="#0076C5"/>
  <!-- Top ellipse -->
  <ellipse cx="22" cy="20" rx="14" ry="3.5" fill="#3499D6"/>
  <!-- Bottom ellipse -->
  <ellipse cx="22" cy="30" rx="14" ry="3.5" fill="#004F8A"/>
  <!-- Feather quill accent (top-right — conveys lightweight) -->
  <path d="M38 5 C44 7 43 17 37 21" stroke="#0076C5" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M38 5 C40 11 39 17 37 21 C36 16 36 10 38 5Z"
        fill="#C5E0F5" stroke="#0076C5" stroke-width="0.5"/>
  <!-- SQLite label on cylinder -->
  <text x="22" y="27" text-anchor="middle" font-family="monospace"
        font-size="7" font-weight="bold" fill="white">SQLite</text>
</svg>
