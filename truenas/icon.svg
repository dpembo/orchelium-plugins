<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- NAS chassis body -->
  <rect x="8" y="14" width="48" height="36" rx="4" fill="#0d6efd"/>
  <rect x="8" y="14" width="48" height="36" rx="4" stroke="#0a58ca" stroke-width="1.2"/>
  <!-- Drive bays -->
  <rect x="14" y="20" width="36" height="6" rx="2" fill="#fff" opacity="0.15"/>
  <rect x="14" y="29" width="36" height="6" rx="2" fill="#fff" opacity="0.15"/>
  <rect x="14" y="38" width="36" height="6" rx="2" fill="#fff" opacity="0.15"/>
  <!-- Drive activity LEDs -->
  <circle cx="46" cy="23" r="2" fill="#00e5ff"/>
  <circle cx="46" cy="32" r="2" fill="#00e5ff" opacity="0.5"/>
  <circle cx="46" cy="41" r="2" fill="#69f0ae"/>
  <!-- Label -->
  <text x="25" y="25.5" font-family="Arial,sans-serif" font-size="5.5" font-weight="bold" fill="#fff">TrueNAS</text>
</svg>
