<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Left cylinder (source) -->
  <ellipse cx="13" cy="16" rx="9" ry="3" fill="#B3E5FC" stroke="#0277BD" stroke-width="1.8"/>
  <rect x="4" y="16" width="18" height="12" fill="#B3E5FC" stroke="none"/>
  <line x1="4"  y1="16" x2="4"  y2="28" stroke="#0277BD" stroke-width="1.8"/>
  <line x1="22" y1="16" x2="22" y2="28" stroke="#0277BD" stroke-width="1.8"/>
  <ellipse cx="13" cy="28" rx="9" ry="3" fill="#81D4FA" stroke="#0277BD" stroke-width="1.8"/>

  <!-- Right cylinder (destination) -->
  <ellipse cx="35" cy="16" rx="9" ry="3" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.8"/>
  <rect x="26" y="16" width="18" height="12" fill="#C8E6C9" stroke="none"/>
  <line x1="26" y1="16" x2="26" y2="28" stroke="#2E7D32" stroke-width="1.8"/>
  <line x1="44" y1="16" x2="44" y2="28" stroke="#2E7D32" stroke-width="1.8"/>
  <ellipse cx="35" cy="28" rx="9" ry="3" fill="#A5D6A7" stroke="#2E7D32" stroke-width="1.8"/>

  <!-- Arrow between cylinders -->
  <line x1="22" y1="22" x2="26" y2="22" stroke="#555" stroke-width="2.2"/>
  <polygon points="26,22 23,20 23,24" fill="#555"/>

  <!-- ZFS label -->
  <text x="24" y="44" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#0277BD">ZFS</text>
  <text x="24" y="46" text-anchor="middle" font-family="monospace" font-size="0" fill="none"/>
  <!-- send/recv label -->
  <text x="24" y="44" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#0277BD">send|recv</text>
</svg>
