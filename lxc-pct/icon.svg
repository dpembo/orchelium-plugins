<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Container box -->
  <rect x="7" y="12" width="34" height="24" rx="3"
        fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <!-- Lid / top stripe -->
  <rect x="7" y="12" width="34" height="7" rx="3"
        fill="#A5D6A7" stroke="#2E7D32" stroke-width="2"/>
  <!-- LXC text -->
  <text x="24" y="31" text-anchor="middle" font-family="monospace"
