<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Background circle -->
  <circle cx="24" cy="24" r="20" fill="#336791"/>
  <!-- Left ear (behind head) -->
  <ellipse cx="12" cy="17" rx="5.5" ry="7.5" fill="#264F6B"/>
  <!-- Head -->
  <circle cx="23" cy="19" r="11" fill="#4A86AE"/>
  <!-- Trunk (curves right then down) -->
  <path d="M32 25 C38 26 39 34 34 38"
        stroke="#264F6B" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="21" cy="16" r="2.2" fill="white"/>
  <circle cx="21.5" cy="16.5" r="1" fill="#1a1a2e"/>
  <!-- Body -->
  <ellipse cx="22" cy="33" rx="9" ry="6" fill="#336791"/>
  <!-- Legs -->
  <rect x="13" y="36" width="5" height="9" rx="2.5" fill="#264F6B"/>
  <rect x="21" y="37" width="5" height="8" rx="2.5" fill="#264F6B"/>
</svg>
