<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Shield outline -->
  <path d="M24 4 L8 12 L8 24 Q8 36 24 42 Q40 36 40 24 L40 12 Z"
        fill="#E8F4F8" stroke="#D4574F" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Shield gradient effect with multiple layers -->
  <path d="M24 6 L10 13 L10 24 Q10 35 24 40 Q38 35 38 24 L38 13 Z"
        fill="none" stroke="#D4574F" stroke-width="1.5" opacity="0.5" stroke-linejoin="round"/>
  
  <!-- Firewall/network icon inside shield - interconnected nodes -->
  <!-- Center node -->
  <circle cx="24" cy="22" r="2.5" fill="#D4574F"/>
  
  <!-- Top nodes -->
  <circle cx="16" cy="15" r="2" fill="#D4574F"/>
  <circle cx="32" cy="15" r="2" fill="#D4574F"/>
  
  <!-- Bottom nodes -->
  <circle cx="18" cy="30" r="2" fill="#D4574F"/>
  <circle cx="30" cy="30" r="2" fill="#D4574F"/>
  
  <!-- Connecting lines forming network -->
  <line x1="24" y1="22" x2="16" y2="15" stroke="#D4574F" stroke-width="1.2" opacity="0.8"/>
  <line x1="24" y1="22" x2="32" y2="15" stroke="#D4574F" stroke-width="1.2" opacity="0.8"/>
  <line x1="24" y1="22" x2="18" y2="30" stroke="#D4574F" stroke-width="1.2" opacity="0.8"/>
  <line x1="24" y1="22" x2="30" y2="30" stroke="#D4574F" stroke-width="1.2" opacity="0.8"/>
  <line x1="16" y1="15" x2="32" y2="15" stroke="#D4574F" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="30" x2="30" y2="30" stroke="#D4574F" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Checkmark indicating security -->
  <path d="M28 27 L31 30 L36 24"
        fill="none" stroke="#2ecc71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  
  <!-- Label -->
  <text x="24" y="47" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#D4574F">opnsense</text>
</svg>