name: Update Registry

on:
  push:
    branches:
      - main
    paths:
      - 'bitwarden/plugin.yaml'
      - 'borg/plugin.yaml'
      - 'docker/plugin.yaml'
      - 'file-prune/plugin.yaml'
      - 'lxc-pct/plugin.yaml'
      - 'mount/plugin.yaml'
      - 'mysql/plugin.yaml'
      - 'opnsense/plugin.yaml'
      - 'paperless-ngx/plugin.yaml'
      - 'postgresql/plugin.yaml'
      - 'proxmox-backup/plugin.yaml'
      - 'rclone/plugin.yaml'
      - 'restic/plugin.yaml'
      - 'rsync/plugin.yaml'
      - 's3/plugin.yaml'
      - 'sqlite/plugin.yaml'
      - 'systemd/plugin.yaml'
      - 'tar/plugin.yaml'
      - 'truenas/plugin.yaml'
      - 'wake-on-lan/plugin.yaml'
      - 'zfs-send-receive/plugin.yaml'
      - 'zfs-snapshot/plugin.yaml'

jobs:
  update-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate registry.json
        run: python3 scripts/generate-registry.py

      - name: Check if registry.json changed
        id: registry_changed
        run: |
          if git diff --quiet registry.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push registry.json
        if: steps.registry_changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: update registry.json [skip ci]"
          git push
