<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Outer hexagon — Borg's iconic shape -->
  <polygon points="24,3 42,13.5 42,34.5 24,45 6,34.5 6,13.5"
           fill="#E8EAF6" stroke="#3949AB" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Inner hexagon (dedup/layers concept) -->
  <polygon points="24,11 36,17.5 36,30.5 24,37 12,30.5 12,17.5"
           fill="none" stroke="#3949AB" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="3,2"/>
  <!-- Bold B letterform -->
  <text x="24" y="29" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" font-weight="900" fill="#3949AB">B</text>
</svg>
